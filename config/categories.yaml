# --- Prioritization Thresholds ---
thresholds:
  high_value_bdt: 1000000        # >= 10 lakh BDT flagged HIGH_VALUE
  high_quantity_units: 20        # >= 20 units flagged HIGH_VALUE
  critical_days_to_close: 3      # closing within N days flagged CRITICAL

# --- Ingestion Target Registry: Engine 1 (Direct Portals) ---
portal_targets:
  - name: "Prime Bank"
    url: "https://www.primebank.com.bd/tenders"
    parser_type: "html_table"
    active: true
  - name: "BRAC Bank"
    url: "https://www.bracbank.com/en/tenders"
    parser_type: "pdf_links"
    active: true
  - name: "Jamuna Bank"
    url: "https://jamunabankbd.com/tenders"
    parser_type: "html_table"
    active: true
  - name: "Dutch-Bangla Bank (DBBL)"
    url: "https://www.dutchbanglabank.com/tender/tender.html"
    parser_type: "dynamic_playwright"
    active: true
  - name: "Bangladesh Bank"
    url: "https://www.bb.org.bd/mediaroom/tenders/tender.php"
    parser_type: "html_table"
    active: true

# --- Ingestion Target Registry: Engine 2 (Daily E-Paper Sources) ---
epaper_targets:
  - name: "The Financial Express"
    domain: "epaper.thefinancialexpress.com.bd"
    url_template: "https://epaper.thefinancialexpress.com.bd/index.php?opt=view&page={page}&date={date}"
    target_pages: ["Business", "Classified", "1", "2"]
    language: "EN"
    active: true
  - name: "The Daily Star"
    domain: "epaper.thedailystar.net"
    url_template: "https://epaper.thedailystar.net/index.php?opt=view&page={page}&date={date}"
    target_pages: ["Business", "Classified", "1"]
    language: "EN"
    active: true
  - name: "Prothom Alo"
    domain: "epaper.prothomalo.com"
    url_template: "https://epaper.prothomalo.com/index.php?opt=view&page={page}&date={date}"
    target_pages: ["বিজ্ঞপ্তি", "ব্যবসা-বাণিজ্য", "1", "2"]
    language: "BN"
    active: true
  - name: "Bonik Barta"
    domain: "epaper.bonikbarta.net"
    url_template: "https://epaper.bonikbarta.net/index.php?opt=view&page={page}&date={date}"
    target_pages: ["বিজ্ঞপ্তি", "1"]
    language: "BN"
    active: true
