name: Daily Tender Scan & Auto Digest

on:
  schedule:
    # 00:00 UTC = 06:00 AM Asia/Dhaka (BDT)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual run button in GitHub UI

permissions:
  contents: write

jobs:
  run-tender-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System OCR Dependencies (Tesseract & Bangla Pack)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ben libtesseract-dev libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion & Email Pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LOG_LEVEL: "INFO"
        run: |
          python main.py

      - name: Commit & Push Updated Database (Deduplication State)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tenders.db || true
          git diff --staged --quiet || git commit -m "chore: update tender deduplication state [skip ci]"
          git push origin main || git push
